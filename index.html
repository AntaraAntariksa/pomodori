<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pomodori</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Background -->
    <div id="background"></div>
    <div id="overlay"></div>
    <main class="app">
        <h1 class="logo">POMODORI</h1>

        <!-- TIMER -->
        <section class="timer-card">
            <p id="mode">FOCUS</p>
            <div id="timer">25:00</div>
            <div class="buttons">
                <button id="startButton">
                    START
                </button>
                <button id="resetButton">
                    RESET
                </button>
            </div>
        </section>

        <!-- SETTINGS -->
        <section class="settings">
            <div class="setting">
                <label for="focusInput">
                    Focus
                </label>
                <div class="input-group">
                    <input
                        type="number"
                        id="focusInput"
                        value="25"
                        min="1"
                    >
                    <span>min</span>
                </div>
            </div>

            <div class="setting">
                <label for="breakInput">
                    Break
                </label>
                <div class="input-group">
                    <input
                        type="number"
                        id="breakInput"
                        value="5"
                        min="1"
                    >
                    <span>min</span>
                </div>
            </div>


            <div class="setting">
                <label for="sessionInput">
                    Sessions
                </label>
                <input
                    type="number"
                    id="sessionInput"
                    value="4"
                    min="1"
                >
            </div>
        </section>

        <!-- SESSION PROGRESS -->
        <section class="progress">
            <p>
                Session
                <span id="sessionNumber">1</span>
                /
                <span id="totalSessions">4</span>
            </p>
            <div id="dots"></div>
        </section>

        <!-- CUSTOMIZE -->
        <button
            id="customizeButton"
            class="customize-button"
        >
            CUSTOMIZE
        </button>

        <section
            id="customizePanel"
            class="customize-panel"
        >
            <h2>Customize</h2>

            <!-- THEME PICKER -->
            <div class="customize-section">
                <label>
                    Theme
                </label>
                <div class="theme-picker">
                    <button
                        class="theme-option"
                        data-theme="cozy"
                    >
                        <span class="theme-preview cozy-preview"></span>
                        <span>Brown</span>
                    </button>

                    <button
                        class="theme-option"
                        data-theme="cute"
                    >
                        <span class="theme-preview cute-preview"></span>
                        <span>Pink</span>
                    </button>

                    <button
                        class="theme-option"
                        data-theme="glass"
                    >
                        <span class="theme-preview glass-preview"></span>
                        <span>Glass</span>
                    </button>

                    <button
                        class="theme-option"
                        data-theme="clean"
                    >
                        <span class="theme-preview clean-preview"></span>
                        <span>BnW</span>
                    </button>
                </div>
            </div>

            <!-- BACKGROUND -->
            <div class="customize-section">
                <label for="backgroundInput">
                    Background image
                </label>
                <input
                    type="file"
                    id="backgroundInput"
                    accept="image/*"
                >
            </div>

            <!-- OVERLAY -->
            <div class="customize-section">
                <label for="overlayInput">
                    Background darkness
                </label>
                <input
                    type="range"
                    id="overlayInput"
                    min="0"
                    max="0.7"
                    step="0.05"
                    value="0.2"
                >
            </div>

            <button
                id="removeBackgroundButton"
            >
                REMOVE BACKGROUND
            </button>
        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
